<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker News日本語要約</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #fff7ed;
            --surface: #ffffff;
            --surface-soft: #fffaf5;
            --text: #1f2933;
            --muted: #667085;
            --border: #f0dfcf;
            --accent: #ff6600;
            --accent-strong: #e45a00;
            --accent-soft: #fff0e4;
            --shadow-sm: 0 1px 2px rgba(31, 41, 51, 0.06), 0 1px 3px rgba(31, 41, 51, 0.08);
            --shadow-md: 0 16px 40px rgba(31, 41, 51, 0.10);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', Roboto, sans-serif;
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 20px 40px;
            line-height: 1.65;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 102, 0, 0.14), transparent 34rem),
                linear-gradient(180deg, #fffaf4 0%, var(--bg) 42%, #fff 100%);
        }
        .header {
            position: relative;
            overflow: hidden;
            padding: 44px 72px 40px 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,246,237,0.94));
            border: 1px solid rgba(255, 102, 0, 0.14);
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }
        .header::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -120px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 102, 0, 0.10);
            pointer-events: none;
        }
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            box-shadow: var(--shadow-sm);
            z-index: 1;
        }
        .header h1 {
            color: var(--accent);
            font-size: clamp(2rem, 5vw, 3.1rem);
            letter-spacing: 0;
            line-height: 1.12;
            margin: 0;
        }
        .header p {
            color: var(--muted);
            font-size: 1.05rem;
            margin: 14px 0 0 0;
            max-width: 38rem;
        }
        .rss-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 11px 18px;
            text-decoration: none;
            border-radius: 999px;
            margin-top: 24px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(255, 102, 0, 0.22);
        }
        .rss-link:hover {
            background: var(--accent-strong);
        }
        .articles {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .date-section {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }
        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .article-card {
            background: var(--surface);
            border-radius: 8px;
            padding: 18px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(31, 41, 51, 0.10);
            border-color: rgba(255, 102, 0, 0.36);
        }
        .article-title {
            font-size: 1.05rem;
            margin: 0 0 10px;
            color: var(--text);
            line-height: 1.45;
        }
        .article-title a {
            text-decoration: none;
            color: inherit;
        }
        .article-title a:hover {
            color: var(--accent);
        }
        .article-meta {
            color: var(--muted);
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .article-content {
            flex: 1;
        }
        .article-rank {
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 2px;
        }
        .date-navigation {
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
        }
        .nav-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
            min-width: 40px;
        }
        .nav-btn:hover {
            background: var(--accent-strong);
        }
        .nav-btn:disabled {
            background: #d0d5dd;
            cursor: not-allowed;
        }
        .date-picker-container {
            position: relative;
        }
        .current-date {
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 6px;
            transition: background 0.2s;
            user-select: none;
        }
        .current-date:hover {
            background: var(--accent-soft);
        }
        .date-selector {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow-md);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .date-option {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .date-option:hover {
            background: var(--accent-soft);
        }
        .date-option:last-child {
            border-bottom: none;
        }
        .article-summary {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .rank-badge {
            background: var(--accent-soft);
            color: var(--accent-strong);
            padding: 5px 9px;
            border: 1px solid rgba(255, 102, 0, 0.22);
            border-radius: 999px;
            font-size: 0.78em;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 32px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
        }
        .footer a {
            color: var(--accent);
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: var(--muted);
        }
        @media (max-width: 640px) {
            body {
                padding: 16px 12px 28px;
            }
            .header {
                padding: 68px 20px 28px;
            }
            .date-navigation {
                position: sticky;
                top: 8px;
                z-index: 10;
            }
            .article-card {
                padding: 15px;
            }
        }

        /* Dark Mode */
        body.dark-mode {
            color-scheme: dark;
            --bg: #0f1218;
            --surface: #171b23;
            --surface-soft: #202631;
            --text: #f2f4f7;
            --muted: #aab3c2;
            --border: #2a3240;
            --accent: #ff9a4d;
            --accent-strong: #ffb274;
            --accent-soft: rgba(255, 154, 77, 0.14);
            background:
                radial-gradient(circle at top left, rgba(255, 154, 77, 0.14), transparent 34rem),
                linear-gradient(180deg, #141923 0%, var(--bg) 58%, #0c0f14 100%);
            color: var(--text);
        }
        body.dark-mode .header,
        body.dark-mode .date-section,
        body.dark-mode .date-navigation,
        body.dark-mode .footer {
            background: rgba(23, 27, 35, 0.88);
            box-shadow: 0 16px 40px rgba(0,0,0,0.36);
        }
        body.dark-mode .dark-mode-toggle {
            background: rgba(32, 38, 49, 0.82);
            border-color: var(--border);
            color: var(--text);
        }
        body.dark-mode .header h1,
        body.dark-mode .date-header,
        body.dark-mode .current-date {
            color: var(--accent);
        }
        body.dark-mode .header p,
        body.dark-mode .article-meta,
        body.dark-mode .loading,
        body.dark-mode .footer {
            color: var(--muted);
        }
        body.dark-mode .article-card {
            background: var(--surface);
            border-color: var(--border);
        }
        body.dark-mode .article-card:hover {
            border-color: rgba(255, 154, 77, 0.44);
            box-shadow: 0 12px 28px rgba(0,0,0,0.30);
        }
        body.dark-mode .article-title {
            color: var(--text);
        }
        body.dark-mode .article-title a:hover {
            color: var(--accent);
        }
        body.dark-mode .article-summary {
            color: var(--muted);
        }
        body.dark-mode .rss-link,
        body.dark-mode .nav-btn {
            background: var(--accent);
            color: #121212;
        }
        body.dark-mode .rss-link:hover,
        body.dark-mode .nav-btn:hover {
            background: var(--accent-strong);
        }
        body.dark-mode .nav-btn:disabled {
            background: #343b49;
            color: #737d8c;
        }
        body.dark-mode .current-date:hover {
            background: var(--accent-soft);
        }
        body.dark-mode .date-selector {
            background: var(--surface);
            border-color: var(--border);
        }
        body.dark-mode .date-option:hover {
            background: var(--accent-soft);
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="darkModeToggle" class="dark-mode-toggle" title="Toggle dark mode">🌓</button>
        <h1>Hacker News 日本語要約</h1>
        <p>Hacker Newsの記事コメントを日本語で要約しています</p>
        <a href="rss.xml" class="rss-link">RSS フィードを購読</a>
    </div>
    
    <div class="date-navigation">
        <button class="nav-btn" id="prevBtn" onclick="navigateDate(-1)">←</button>
        <div class="date-picker-container">
            <div class="current-date" id="currentDate" onclick="toggleDatePicker()">2025年07月30日</div>
            <div class="date-selector" id="datePicker"></div>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="navigateDate(1)">→</button>
    </div>
    
    <div class="articles" id="articlesContainer"></div>
    
    <script>
        const articlesData = ${articles_data};
        const sortedDates = ${sorted_dates};
        let currentDateIndex = 0;
        let datePickerVisible = false;
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showDate(dateKey) {
            const container = document.getElementById('articlesContainer');
            const data = articlesData[dateKey];
            
            if (!data) {
                container.innerHTML = '<div class="loading">データが見つかりません</div>';
                return;
            }
            
            let html = 
                '<div class="date-section">' +
                    '<div class="articles-list">';
            
            data.articles.forEach(article => {
                html += 
                    '<div class="article-card">' +
                        '<div class="article-rank">' +
                            '<span class="rank-badge">#' + article.rank + '</span>' +
                        '</div>' +
                        '<div class="article-content">' +
                            '<h3 class="article-title">' +
                                '<a href="pages/' + article.id + '.html">' + escapeHtml(article.title) + '</a>' +
                            '</h3>' +
                            '<div class="article-summary">' + escapeHtml(article.preview) + '</div>' +
                        '</div>' +
                    '</div>';
            });
            
            html += 
                    '</div>' +
                '</div>';
            
            container.innerHTML = html;
            
            // Update current date display
            document.getElementById('currentDate').textContent = data.formatted_date;
            
            // Update navigation buttons
            currentDateIndex = sortedDates.indexOf(dateKey);
            document.getElementById('prevBtn').disabled = currentDateIndex === 0;
            document.getElementById('nextBtn').disabled = currentDateIndex === sortedDates.length - 1;
        }
        
        function navigateDate(direction) {
            const newIndex = currentDateIndex + direction;
            if (newIndex >= 0 && newIndex < sortedDates.length) {
                showDate(sortedDates[newIndex]);
            }
        }
        
        function toggleDatePicker() {
            const picker = document.getElementById('datePicker');
            datePickerVisible = !datePickerVisible;
            
            if (datePickerVisible) {
                picker.style.display = 'block';
            } else {
                picker.style.display = 'none';
            }
        }
        
        function selectDate(dateKey) {
            showDate(dateKey);
            toggleDatePicker();
        }
        
        function initializePage() {
            const pickerContainer = document.getElementById('datePicker');
            
            // Populate date picker with options
            sortedDates.forEach(dateKey => {
                const data = articlesData[dateKey];
                const option = document.createElement('div');
                option.className = 'date-option';
                option.textContent = data.formatted_date;
                option.onclick = () => selectDate(dateKey);
                pickerContainer.appendChild(option);
            });
            
            // Show latest date by default
            if (sortedDates.length > 0) {
                showDate(sortedDates[0]);
            }
            
            // Close picker when clicking outside
            document.addEventListener('click', (e) => {
                const pickerContainer = document.querySelector('.date-picker-container');
                if (!pickerContainer.contains(e.target) && datePickerVisible) {
                    toggleDatePicker();
                }
            });
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializePage);

        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;

        const applyTheme = (theme) => {
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                darkModeToggle.textContent = '☀️';
            } else {
                body.classList.remove('dark-mode');
                darkModeToggle.textContent = '🌓';
            }
        };

        darkModeToggle.addEventListener('click', () => {
            const isDarkMode = body.classList.contains('dark-mode');
            const newTheme = isDarkMode ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme) {
                applyTheme(savedTheme);
            } else if (prefersDark) {
                applyTheme('dark');
            }
        });
    </script>
    
    <div class="footer">
        <p>
            更新頻度: 毎日 | 
            <a href="https://github.com/kj-9/hacker-news-ja-summary">GitHub</a> | 
            <a href="rss.xml">RSS</a>
        </p>
        <p>記事の要約は AI によって生成されており、内容の正確性は保証されません。</p>
    </div>
</body>
</html>
